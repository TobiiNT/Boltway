# Cut a tag, and publish what it points at.
#
# This exists because cutting the tag by hand is the one step of a release that a person had to be
# at a terminal for. Every publish before this was a `workflow_dispatch` on `publish packages`,
# which builds whatever `main` happens to be at that moment and leaves no ref naming what went out;
# the `push: tags` trigger that would have fixed that had never been used, because pushing a tag
# means having a checkout, a credential and the discipline to type the version twice.
#
# So the tag is cut here, from a form, by the runner.
#
# THE TRAP THIS WORKFLOW IS SHAPED AROUND
# ---------------------------------------
# A tag pushed with `GITHUB_TOKEN` does not start another workflow. GitHub blocks that on purpose —
# it is what stops a workflow from triggering itself forever — and the consequence here is specific
# and silent: the obvious design, "create the tag and let `publish packages` notice", produces a
# green run, a tag in the repository, and **no packages**. Nothing reports it. Somebody finds out
# when a consumer cannot restore.
#
# The ways out are a personal access token, a GitHub App, or not depending on the trigger. The first
# two mean a long-lived credential for a job whose whole content is `git tag`, which is the trade
# `README.md` argues against everywhere else. The third is free: this calls the publish
# workflow directly.
#
# WHAT THAT BUYS BEYOND THE TAG
# -----------------------------
# `publish packages` now takes a ref, so the packages are built from the **tagged tree**. A
# `workflow_dispatch` publishes the branch's head, which is the same thing right up until somebody
# merges while a release is running — and then the tag names one tree and the feed holds another,
# with nothing anywhere saying so.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to cut, e.g. v0.3.0. Must start with v — that is what `publish packages` matches.'
        required: true
        type: string
      message:
        description: 'What this release contains. Becomes the annotated tag message.'
        required: false
        type: string
      ref:
        description: 'What to tag. Defaults to the branch this was dispatched on.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest

    # A clone and a `git tag`. Anything past ten minutes is a hung fetch, not a slow one, and the
    # default ceiling of 360 minutes would hold the release for six hours before saying so. The
    # reasoning for putting a ceiling on every job is written out once, in ci.yml's `test` job.
    timeout-minutes: 10

    # The only job here that needs to write, and the only thing it writes is one ref.
    permissions:
      contents: write

    outputs:
      sha: ${{ steps.cut.outputs.sha }}

    steps:
      # Pinned to a commit rather than a tag: a tag is a mutable pointer in somebody else's
      # repository, and this job holds `contents: write` on this one. The full argument, and the
      # dependabot half that keeps a pin from rotting, is in publish-packages.yml.
      #
      # Full history and every tag: the existence check below is worthless against a shallow clone
      # that fetched none, and it would pass by seeing nothing rather than by finding nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Cut it
        id: cut
        env:
          TAG: ${{ inputs.tag }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail

          # `v*` because that is what `publish packages` matches and what every document here calls
          # a release tag. A tag that does not match would publish nothing on the trigger path and
          # would be a name nobody can find later.
          case "$TAG" in
            v*) ;;
            *) echo "::error::'$TAG' does not start with 'v'."; exit 1 ;;
          esac

          # Refuse rather than move. A tag that has been pushed is what a consumer resolved a
          # package version through; moving it leaves nothing connecting the two, and the packages
          # it published cannot be unpublished in any way that helps. Cutting another tag is cheap.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists. Tags are never moved here — cut another."
            exit 1
          fi

          # The tag names a version, and until now nothing checked that it named *this* one.
          # `Directory.Build.props` is the single literal every package publishes at and
          # CONTRIBUTING requires bumping it in the commit that changed the surface, so the tag is
          # purely derivative — which makes this an equality check rather than a judgement.
          #
          # Without it, dispatching `v0.3.0` against a tree still reading 0.2.0 cuts the tag,
          # publishes every package at 0.2.0, and reports success. The header at the top of this
          # file says the old process needed "the discipline to type the version twice"; the second
          # typing was removed and this is the check that replaced it.
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)"
          if [ -z "$VERSION" ]; then
            echo "::error::No <Version> in Directory.Build.props, so $TAG cannot be checked against it."
            exit 1
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::$TAG names a release of $VERSION. Bump <Version> in Directory.Build.props,"
            echo "::error::or cut v$VERSION — publishing $VERSION under $TAG leaves the tag pointing"
            echo "::error::at packages that do not carry its number."
            exit 1
          fi

          # CONTRIBUTING step 2: the version's section in CHANGELOG.md carries the date the tag is
          # cut. Until now nothing checked it, and the two ways it goes wrong are different.
          #
          # **Undated is the loud one.** A section still headed `unreleased` is a lie the moment
          # somebody restores the version, and CHANGELOG.md is not packed into the packages — so
          # after the tag exists, correcting it leaves main saying one thing and the tagged tree
          # another. Here is the last moment it is free.
          #
          # **Misdated is the quiet one, and it is what actually happened.** 0.2.0 was dated
          # 2026-08-23 in a pull request that merged at 01:33 UTC on the 24th: a day behind under
          # UTC and under the local clock alike, caught by re-reading rather than by anything here.
          #
          # The window is today or tomorrow in UTC, and the asymmetry is deliberate. A maintainer
          # ahead of UTC dates it by their own day, which is UTC's day or the one after — never the
          # one before. Widening it to yesterday would admit exactly the case above.
          HEADING="$(grep -m1 "^## \[$VERSION\]" CHANGELOG.md || true)"
          if [ -z "$HEADING" ]; then
            echo "::error::CHANGELOG.md has no section headed [$VERSION]. The version being tagged is"
            echo "::error::the one a consumer looks up by that heading."
            exit 1
          fi

          DATE="$(printf '%s' "$HEADING" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 || true)"
          if [ -z "$DATE" ]; then
            echo "::error::CHANGELOG.md's [$VERSION] section carries no date: $HEADING"
            echo "::error::Date it before cutting the tag. CHANGELOG.md is not packed into the"
            echo "::error::packages, so after this the tagged tree keeps whatever it says now."
            exit 1
          fi

          TODAY="$(date -u +%F)"
          TOMORROW="$(date -u -d '+1 day' +%F)"
          if [ "$DATE" != "$TODAY" ] && [ "$DATE" != "$TOMORROW" ]; then
            echo "::error::CHANGELOG.md dates $VERSION at $DATE and this tag is being cut on $TODAY (UTC)."
            echo "::error::CONTRIBUTING.md defines that date as the day the tag is cut. Re-date the"
            echo "::error::section and dispatch again — it is one line, and it is only free until the"
            echo "::error::tag exists."
            exit 1
          fi

          SHA="$(git rev-parse HEAD)"

          # Annotated, not lightweight. An annotated tag carries a message, an author and a date, so
          # "what was in this release and who cut it" survives without a release note somewhere else.
          # Empty input still gets a message, because `git tag -a -m ''` is refused.
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$TAG" "$SHA" \
              -m "${MESSAGE:-$TAG}"

          git push origin "refs/tags/$TAG"

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Cut $TAG at $SHA" >> "$GITHUB_STEP_SUMMARY"

  # Called rather than triggered — see the note at the top about GITHUB_TOKEN and tag pushes. The
  # tests run inside this, before anything is packed, which is the last moment any of it is
  # reversible.
  publish:
    needs: tag

    # No `timeout-minutes` here, and it is not an oversight: a job that calls a reusable workflow
    # takes no job-level keys beyond the few listed for `uses`, so writing one is a syntax error
    # rather than a ceiling. The ceiling for this work lives on the `publish` job inside
    # publish-packages.yml, which is the job that actually runs.
    #
    # A called workflow's own `permissions:` block can only narrow what this job grants — it cannot
    # widen it. `publish-packages.yml` declares `id-token: write` for nuget.org Trusted Publishing,
    # and that declaration is ignored on this path, so omitting it here left `NuGet/login` with no
    # OIDC token: the tag-push path published to nuget.org and the documented release path could
    # not, with nothing testing the difference. It failed after the tag was pushed and after
    # GitHub Packages was written, neither of which is reversible.
    permissions:
      contents: read
      packages: write
      id-token: write

    uses: ./.github/workflows/publish-packages.yml
    with:
      ref: ${{ needs.tag.outputs.sha }}
    secrets: inherit

  # The images already exist; this only gives them the release's name.
  #
  # `ci` builds and pushes ghcr.io/<owner>/<name> on every push to main, tagged with the commit sha,
  # a build number and `latest`. So after a release there is a tag naming the source, a feed holding
  # the packages, and images that answer to none of it: "which image is v0.3.0" was a question you
  # went to git to answer.
  #
  # Re-tagged by digest rather than rebuilt. `imagetools create` adds a name to a manifest already in
  # the registry, so the versioned tag is the *same bytes* CI tested — a rebuild would be a second
  # image built from the same tree, which is not the same claim and is one `docker build` away from
  # not being the same image.
  #
  # After `publish`, not beside it: `v0.3.0` on an image means "this is that release", and a release
  # whose packages failed to go out is not one.
  images:
    needs: [tag, publish]
    runs-on: ubuntu-latest

    # Two registry writes against manifests that already exist — no build, no push of bytes. A
    # ceiling for the reason ci.yml's `test` job writes out; this one is low because there is
    # nothing here that legitimately takes long.
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      # Pinned to commits rather than tags — see publish-packages.yml for the argument. The login
      # below is the sharpest case in this repository: a third-party action, `packages: write`, and
      # a registry password on its input.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag each image at the release
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ needs.tag.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # The names come from ci.yml rather than from a copy of its list. That file's own comment
          # says a second hand-written copy is where two things stop being identical — and the drift
          # here would be silent in the worst way: a new image would build, push and test on every
          # commit, and simply never receive a version tag.
          #
          # **`yq` rather than python, and the dependency is the whole reason.** This was a heredoc
          # whose first line was `import yaml`. PyYAML is not in the standard library and nothing
          # here installed it: the step worked only because the runner image happens to ship it. An
          # undeclared dependency is a step that breaks when somebody else changes an image, and
          # this is the last step of a release — the tag is pushed, both feeds are written, and none
          # of that can be taken back. `pinned-drafts.yml` states the rule out loud for a much
          # cheaper job: a check whose own dependencies can break goes red for reasons that have
          # nothing to do with what it watches.
          #
          # yq is preinstalled on the GitHub-hosted runner images, so this removes a dependency
          # rather than swapping one for another. Named explicitly when it is absent all the same,
          # because `yq: command not found` is a two-word failure at the most expensive moment this
          # workflow has.
          command -v yq >/dev/null || {
            echo "::error::yq is not on this runner. It ships in the GitHub-hosted images; a"
            echo "::error::self-hosted runner has to install it. Do not reach back for python and"
            echo "::error::PyYAML here — that undeclared import is what this step replaced."
            exit 1
          }

          yq '.jobs.image.strategy.matrix.include[].name' .github/workflows/ci.yml > names.txt

          # A parse that found nothing would tag nothing and report success, which is the failure
          # this whole job exists to stop happening to somebody else.
          [ -s names.txt ] || { echo "::error::no image names found in ci.yml"; exit 1; }

          while read -r NAME; do
            # Each name goes into a registry reference and then into a write, so it is checked
            # rather than trusted. A yq that ever returned something quoted, null, or a whole
            # sub-document would otherwise produce a reference that is *almost* right, and the
            # symptom would be a missing image tag on a release nobody re-reads. Cheap, exact, and
            # it fails naming the value rather than passing it on.
            #
            # Uppercase is allowed here even though a registry will not take it: the line below
            # lowercases the whole reference, exactly as ci.yml does, so a capital in the matrix is
            # legal today. Narrowing this to what a registry accepts would reject a configuration
            # that currently works — a check that invents a rule is a check that fails a release
            # for no defect.
            case "$NAME" in
              ''|*[!a-zA-Z0-9._-]*)
                echo "::error::'$NAME' is not a plain image name. It came out of the matrix in"
                echo "::error::ci.yml, so either that matrix changed shape or yq printed something"
                echo "::error::other than a bare scalar — check the step's output above."
                exit 1 ;;
            esac

            IMAGE="$(echo "ghcr.io/$OWNER/$NAME" | tr '[:upper:]' '[:lower:]')"

            # Named separately from the failure below, because the cure is different: this one means
            # `ci` has not finished with this commit yet, and the fix is to wait and re-run rather
            # than to look for a broken build.
            docker buildx imagetools inspect "$IMAGE:$SHA" >/dev/null 2>&1 || {
              echo "::error::$IMAGE:$SHA is not in the registry. The image job on main builds it — if"
              echo "::error::that run is still going, wait for it and re-run this job."
              exit 1
            }

            docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE:$SHA"

            echo "$IMAGE:$TAG -> $SHA" >> "$GITHUB_STEP_SUMMARY"
          done < names.txt

  # Last, and the ordering is the same argument the `images` job makes one level up: a release page
  # says "this is v0.3.0, here is what is in it", and a release whose packages did not go out or
  # whose images never got the name is not one. Anything that has to be true before somebody reads
  # that page has already been checked by the time this starts.
  #
  # Called rather than inlined, because the two tags cut before this existed need the same treatment
  # and a `workflow_dispatch` is how they get it. A copy of these lines here plus a repair script
  # somewhere else is two implementations of one release note, and they would agree for about a
  # month.
  announce:
    needs: [tag, publish, images]

    # `contents: write` for the release itself. As on `publish`, a called workflow's own
    # `permissions:` block can only narrow what this grants, never widen it — so what is written
    # here is what the job actually gets, and omitting it would leave `gh release create` with a
    # read-only token after the tag was pushed and both feeds were written.
    permissions:
      contents: write

    uses: ./.github/workflows/announce-release.yml
    with:
      tag: ${{ inputs.tag }}

      # Always the newest thing released, because this only ever runs on a tag cut minutes ago. The
      # input exists for the dispatch path, where filling in an older tag must not move the Latest
      # badge backwards.
      latest: true
