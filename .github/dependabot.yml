# What keeps a pin from becoming a fossil.
#
# Every third-party action in `.github/workflows/` names a commit sha rather than a tag, because a
# tag is a mutable pointer in somebody else's repository and one of those actions runs with
# `packages: write` and a registry password while another receives the OIDC token that mints a
# nuget.org publishing key. That is the same argument `Directory.Packages.props` makes about
# floating a NuGet version — "one silent minor bump away from a different security posture than the
# one that was reviewed" — applied to the dependencies that appear in no lockfile at all.
#
# **A pin without this file is the other failure, not the absence of one.** A sha that nobody moves
# is a workflow running two-year-old code, including whatever was fixed in it since. Dependabot
# rewrites the sha *and* the trailing `# vX.Y.Z` comment together, which is why the pins are written
# in that exact form: the comment is what makes a diff of forty hex characters reviewable, and it
# stays true because the same tool moves both halves.
#
# The trade this file makes is deliberate — a pin turns "trusted forever, silently" into "reviewed
# on a schedule", and the review is the part that has to actually happen.

version: 2

updates:
  # The actions.
  #
  # **Grouped into one pull request**, which is the opposite choice to NuGet below and the reason is
  # the audience. Nobody has an opinion about `actions/checkout` 4.4.0 versus 4.4.1 in isolation; a
  # weekly pull request per action is five notifications that get closed unread, and this repository
  # has written down twice what happens to a signal its reader has learned to skip. One pull request
  # a week is a review somebody actually does.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'

  # The packages.
  #
  # **Not grouped, on purpose.** `Directory.Packages.props` pins every version exactly because this
  # is an authorization server and a silent bump to a crypto or token-handling dependency is a
  # different security posture than the one that was reviewed. A grouped pull request makes that a
  # single accept-or-reject over a dozen libraries; separate ones make each bump a diff somebody
  # looked at, which is what the pinning was for.
  #
  # The one exception is the persistence family. `Npgsql` is pinned to the same version the EF
  # provider resolves transitively — the props file says so and says pinning it "changes nothing
  # today and makes the next bump one decision instead of two" — so a pull request that moved one
  # without the other would either be a no-op or a mismatch a person has to notice by hand. They
  # move together or the reason for pinning them alike is gone.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      persistence:
        patterns:
          - 'Microsoft.EntityFrameworkCore*'
          - 'Npgsql*'
    commit-message:
      prefix: 'deps'
